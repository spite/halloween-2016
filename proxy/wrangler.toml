name = "pumpkin-jam-proxy"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGINS = "https://www.clicktorelease.com,https://clicktorelease.com,https://spite.github.io"

# Create with: npx wrangler kv namespace create TOKENS — then paste the id here.
[[kv_namespaces]]
binding = "TOKENS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60
